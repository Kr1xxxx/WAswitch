<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>账号设置</title>
  <style>
    body { margin: 0; padding: 24px; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #16181d; background: #fff; }
    h1 { margin: 0 0 18px; font-size: 20px; }
    label { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
    input, select { height: 38px; border: 1px solid #d5d9de; border-radius: 8px; padding: 0 10px; font: inherit; font-weight: 400; font-size: 14px; }
    .hint { font-weight: 400; font-size: 12px; color: #4a505a; line-height: 1.5; }
    .proxy-row { display: flex; gap: 8px; }
    .proxy-row input { flex: 1; }
    #test { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid #d5d9de; background: #f6f7f9; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
    #testResult { font-weight: 400; font-size: 12px; line-height: 1.5; min-height: 18px; }
    #testResult.ok { color: #0f7a4d; }
    #testResult.bad { color: #b42318; }
    #passwordRow[hidden] { display: none; }
    .error { color: #b42318; font-size: 13px; min-height: 18px; }
    .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
    .row button { height: 38px; padding: 0 18px; border-radius: 19px; font: inherit; font-size: 14px; cursor: pointer; }
    #cancel { border: 1px solid #d5d9de; background: #fff; }
    #save { border: none; background: #16181d; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <h1 id="title">账号设置</h1>
  <label>名称
    <input id="name" type="text">
  </label>
  <label>代理
    <span class="proxy-row">
      <input id="proxy" type="text" placeholder="留空 = 直连，例如 socks5://127.0.0.1:7891" aria-label="代理地址">
      <button id="test" type="button">测试</button>
    </span>
    <span id="testResult" role="status"></span>
    <span class="hint">“测试”会通过这个代理访问 ipinfo.io，查询出口 IP 所在地。</span>
    <span class="hint">用 Clash 时，填这个账号对应节点的本地端口。每个账号一个端口，尽量长期不换。代理连不上时，这个账号会断网，不会改用直连。使用 socks5 代理时，语音和视频通话可能打不通。</span>
  </label>
  <label id="passwordRow" hidden>代理密码
    <input id="password" type="password" autocomplete="off">
    <span class="hint" id="passwordHint">密码会用系统钥匙串加密后保存在本机。</span>
  </label>
  <label>地区（时区和语言）
    <select id="region"></select>
    <span class="hint">应和代理出口所在地一致。点“测试”后会自动选好。</span>
  </label>
  <div class="error" id="error" role="alert"></div>
  <div class="row">
    <button id="cancel" type="button">取消</button>
    <button id="save" type="button">保存</button>
  </div>
  <script src="edit.js"></script>
</body>
</html>
