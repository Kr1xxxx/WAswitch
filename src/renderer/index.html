<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>WAswitch</title>
  <style>
    body { margin: 0; background: #111b21; font-family: system-ui, sans-serif; user-select: none; }
    #list { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; }
    .acc, #add { position: relative; width: 48px; height: 48px; border-radius: 50%; border: none;
      background: #2a3942; color: #e9edef; font-size: 18px; cursor: pointer; }
    .acc.active { background: #00a884; }
    .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; padding: 0 4px; border-radius: 9px;
      background: #d4323b; color: #fff; font-size: 11px; line-height: 18px; }
    .warn { position: absolute; bottom: -4px; left: -4px; width: 18px; height: 18px; border-radius: 9px;
      background: #f5a524; color: #111; font-size: 12px; font-weight: 700; line-height: 18px; }
    #add { background: transparent; border: 2px dashed #3b4a54; color: #8696a0; }
  </style>
</head>
<body>
  <div id="list"></div>
  <script src="sidebar.js"></script>
</body>
</html>
