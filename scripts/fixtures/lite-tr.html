<html><head><meta charset="utf-8"><title>lite</title>

<style>body { margin: 0; } #host { position: fixed; inset: 0; display: flex; }</style>

<!-- 只加载软件界面里的轻量模式聊天页（src/shell/lite.js）和真的样式，给「译文显示在消息下面」的自检用（scripts/check-lite-tr.js）。
     h()、segs()、rawDetail()、icon() 和 window.wa 是最小的替身；点了气泡里的按钮记在 window.__items。
     编辑小窗：window.__entries[h] 是主进程 FloatCore.entry 的替身，保存、纠错、建议记在 window.__calls。 -->
<script>
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return el;
  }
  function segs(...a) { return a.filter(Boolean); }
  function rawDetail(t) { return h('span', null, t); }
  function icon() { const s = document.createElement('span'); s.setAttribute('aria-hidden', 'true'); s.style.cssText = 'display:block;width:14px;height:14px'; return s; }
  function trOpenKey(pid) { window.__calls.push(['key', pid]); }
  window.__entries = {};
  window.__calls = [];
  window.__items = [];
  window.wa = {
    liteSend: async () => ({}), liteOpen: () => {}, openLink: () => {}, retry: () => {},
    onLiteFill: () => {}, liteFilled: () => {},
    onLiteTr: (cb) => { window.__liteTr = cb; },
    dockItem: (h, fix) => { if (fix) window.__calls.push(['fix', h]); else window.__items.push(h); return Promise.resolve({ ok: true }); },
    trItem: async (acc, h) => (window.__entries[h] ? { ...window.__entries[h] } : null),
    dockEdit: async (acc, h, text) => { window.__calls.push(['edit', h, text]); if (window.__entries[h]) Object.assign(window.__entries[h], { tr: text, edited: true }); return true; },
    dockSuggest: async (acc, h, take) => { window.__calls.push(['take', h, take]); return true; },
  };
</script>
<script src="../../src/seltr/trcard.js"></script>
<script src="../../src/shell/lite.js"></script>
</body></html>
