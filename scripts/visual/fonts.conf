<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 截图比对专用：不读系统字体，只用页面里内置的 Inter 和 MiSans；渲染参数写死。
     这样本机和 CI 的 Ubuntu 上字形一模一样，不会因为装了哪些字体、系统设了哪种微调而出差异。 -->
<fontconfig>
  <!-- Chromium 至少要找到一个系统字体才起得来（woff2 它不认）：只放 DejaVu，Ubuntu 自带（fonts-dejavu-core）。
       页面里的字都由内置的 Inter 和 MiSans 画，DejaVu 只是兜底 -->
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <cachedir>/tmp/waswitch-visual-fc-cache</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
