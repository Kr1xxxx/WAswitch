# 打 tag（例如 v0.2.0）时自动打包 Windows 和 macOS 安装包，发到公开的 Kr1xxxx/WAswitch 的 Releases。
# 源码在私有仓库 Kr1xxxx/WAswitch-src；公开的 WAswitch 只放安装包和下载说明，永远不放源码。
# 已装的软件认的是「Kr1xxxx/WAswitch」这个名字（package.json 的 build.publish、src/updater.js、MCP 下载地址），
# 所以更新和下载都从公开仓库拿。发到那里用密钥 RELEASES_TOKEN（只能写 Kr1xxxx/WAswitch 的 Contents），
# 本仓库自带的 GITHUB_TOKEN 只读。
# 所有 action 按 commit 固定版本。
# 自动更新只认这里上传的文件：安装包、latest.yml / latest-mac.yml（含 sha512）和 blockmap。
# 不要手动往 Release 里上传安装包。版本号必须比上一个大（package.json 的 version 和 tag 一致，tag 带 v）。
# MCP 接口不在安装包里：先在一台机器上打成单独的文件 waswitch-mcp-<版本>.js（mcp-module），
# 两个安装包都带上它的 sha512（src/mcp-module.json），用户在设置里下载时按这个校验。
# 构建产物（upload-artifact）只在 job 之间传文件用，留 1 天：私有仓库只有 500 MB 存储，每次约 351 MB。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mcp-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tag 和 package.json 的版本号一致
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: 打包 MCP 模块并自检
        run: npm run check:mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-module
          path: dist-mcp/*
          if-no-files-found: error
          retention-days: 1

  build:
    needs: mcp-module
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tag 和 package.json 的版本号一致
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-module
          path: dist-mcp
      - name: 安装包带上 MCP 文件的校验值
        shell: bash
        run: cp dist-mcp/mcp-module.json src/mcp-module.json && cat src/mcp-module.json
      # 没有代码签名证书：不自动找签名证书，也不在打包时发布
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO: Kr1xxxx/WAswitch
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: 检查发布用的密钥
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::没有配置密钥 RELEASES_TOKEN。需要一个只能写 ${PUBLIC_REPO} 的 Contents 的令牌，放在 WAswitch-src 的 Settings › Secrets and variables › Actions。"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # target_commitish 用公开仓库的 main：私有仓库的提交号在那边不存在，tag 会建在公开仓库的 main 上
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: dist/*
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
      - name: 同步下载说明和 Clash 说明到公开仓库
        run: scripts/sync-public-repo.sh "$PUBLIC_REPO"
      - name: 不登录下载 latest.yml、安装包和 MCP 文件，确认能下
        run: scripts/verify-public-release.sh "$GITHUB_REF_NAME" "$PUBLIC_REPO"
