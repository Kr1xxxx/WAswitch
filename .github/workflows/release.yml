# 打 tag（例如 v0.2.0）时自动打包 Windows 和 macOS 安装包，发到公开的 Kr1xxxx/WAswitch 的 Releases。
# 也可以在 Actions 里对 main 手动运行：tag 取 package.json 的版本号，发布时建（推不了 tag 的环境用）。
# 源码在私有仓库 Kr1xxxx/WAswitch-src；公开的 WAswitch 只放安装包和下载说明，永远不放源码。
# 已装的软件（1.0.7 起）从来财（laicrm.com/api/device/update/）更新、下载 MCP 文件，带团队登录的设备令牌
# （package.json 的 build.publish、src/updater.js、src/mcp-module.js）。GitHub Releases 只留历史。
# 发完 GitHub Release 后，scripts/upload-cloud-release.mjs 把安装包、Mac 的 zip、MCP 文件和 latest.yml / latest-mac.yml
# 传到来财，再让来财换成新版本（来财只留新旧两个版本）。认证用 GitHub Actions 的 OIDC 令牌（publish 有 id-token: write），
# 来财只认本仓库 main 或 v* tag 上的 release.yml，不用密钥。传不上去时整个 job 失败。
# 1.0.6 及更早的版本只认 GitHub，更新不到 1.0.7：要手动装一次 1.0.7（覆盖安装，数据都在）。
# 拆仓库时发到公开仓库用密钥 RELEASES_TOKEN（只能写 Kr1xxxx/WAswitch 的 Contents），本仓库自带的 GITHUB_TOKEN 只读。
# 所有 action 按 commit 固定版本。
# 不要手动往 Release 或来财里上传安装包。版本号必须比上一个大（package.json 的 version 和 tag 一致，tag 带 v）。
# MCP 接口不在安装包里：先在一台机器上打成单独的文件 waswitch-mcp-<版本>.js（mcp-module），
# 两个安装包都带上它的 sha512（src/mcp-module.json），用户在设置里下载时按这个校验。
# job 之间不用 Actions 的构建产物（artifact）传文件：私有仓库的 500 MB 存储按整月累计，2026-11 被旧产物用完后发不了版。
# 改成先建一个草稿 Release，MCP 文件和安装包都直接传到草稿上，下一步再从草稿下载；最后把草稿发出去（这时才建 tag）。
# Release 里的文件不占 Actions 存储。上次失败留下的同名草稿会先删掉重建。
# 没拆仓库时（源码和安装包都在 Kr1xxxx/WAswitch，私有，2026-11-03 决定先不拆）：发到本仓库自己的 Releases，
# 用本仓库的 GITHUB_TOKEN（publish 这一步给写权限），不同步下载说明（会盖掉源码的 README），也不做不登录下载检查
# （私有仓库不登录下不了）。
name: release

on:
  push:
    tags: ['v*']
  # 手动运行只认 main，版本号的 tag 不能已经存在；tag 由下面发布时建在这次运行的提交上
  workflow_dispatch:

# 同一时间只跑一次发版：两次同时往来财传同一个版本会互相覆盖
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mcp-module:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建草稿 Release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      PUBLIC_REPO: Kr1xxxx/WAswitch
      SAME_REPO: ${{ github.repository == 'Kr1xxxx/WAswitch' }}
      GH_TOKEN: ${{ github.repository == 'Kr1xxxx/WAswitch' && secrets.GITHUB_TOKEN || secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tag 和 package.json 的版本号一致
        id: tag
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$v" = "$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF_NAME" = main || { echo "::error::手动运行只认 main"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
              echo "::error::$v 已经发过了，先改 package.json 的版本号"; exit 1
            fi
          fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      - name: 打包 MCP 模块并自检
        run: npm run check:mcp
      # 拆开后 target 用公开仓库的 main：私有仓库的提交号在那边不存在，tag 会建在公开仓库的 main 上。
      # 没拆时 tag 在本仓库：打 tag 运行时已经有了，手动运行时发布那一刻建在这次运行的提交上。
      - name: 建草稿 Release，传上 MCP 文件
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ github.repository == 'Kr1xxxx/WAswitch' && github.sha || 'main' }}
        run: |
          draft=$(gh release view "$TAG" --repo "$PUBLIC_REPO" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$draft" = true ]; then
            echo "删掉上次失败留下的草稿 $TAG"
            gh release delete "$TAG" --repo "$PUBLIC_REPO" --yes
            draft=
          fi
          if [ -z "$draft" ]; then
            gh release create "$TAG" --repo "$PUBLIC_REPO" --draft --prerelease --target "$TARGET" --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" --repo "$PUBLIC_REPO" --clobber dist-mcp/*

  build:
    needs: mcp-module
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 读草稿、往草稿上传安装包
    env:
      PUBLIC_REPO: Kr1xxxx/WAswitch
      TAG: ${{ needs.mcp-module.outputs.tag }}
      GH_TOKEN: ${{ github.repository == 'Kr1xxxx/WAswitch' && secrets.GITHUB_TOKEN || secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tag 和 package.json 的版本号一致
        if: github.event_name == 'push'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: 从草稿 Release 下载 MCP 文件的校验值
        shell: bash
        run: gh release download "$TAG" --repo "$PUBLIC_REPO" -p mcp-module.json -D dist-mcp
      - name: 安装包带上 MCP 文件的校验值
        shell: bash
        run: cp dist-mcp/mcp-module.json src/mcp-module.json && cat src/mcp-module.json
      # 没有代码签名证书：不自动找签名证书，也不在打包时发布
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 安装包传到草稿 Release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml)
          [ ${#files[@]} -gt 0 ] || { echo "::error::dist 里没有安装包"; exit 1; }
          ls -l "${files[@]}"
          gh release upload "$TAG" --repo "$PUBLIC_REPO" --clobber "${files[@]}"

  publish:
    needs: [mcp-module, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # 传到来财用的 OIDC 令牌
    env:
      PUBLIC_REPO: Kr1xxxx/WAswitch
      SAME_REPO: ${{ github.repository == 'Kr1xxxx/WAswitch' }}
      TAG: ${{ needs.mcp-module.outputs.tag }}
      GH_TOKEN: ${{ github.repository == 'Kr1xxxx/WAswitch' && secrets.GITHUB_TOKEN || secrets.RELEASES_TOKEN }}
    steps:
      - name: 检查发布用的密钥
        if: env.SAME_REPO != 'true'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::没有配置密钥 RELEASES_TOKEN。需要一个只能写 ${PUBLIC_REPO} 的 Contents 的令牌，放在 WAswitch-src 的 Settings › Secrets and variables › Actions。"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 从草稿 Release 下载全部文件
        run: |
          gh release download "$TAG" --repo "$PUBLIC_REPO" -D dist
          ls -l dist
          for f in 'WAswitch-Setup-*.exe' '*.dmg' '*.zip' 'latest.yml' 'latest-mac.yml' 'waswitch-mcp-*.js' 'mcp-module.json'; do
            compgen -G "dist/$f" >/dev/null || { echo "::error::草稿 Release 里缺 $f"; exit 1; }
          done
      # 草稿发出去：这时才建 tag（手动运行时建在草稿记下的这次运行的提交上）
      - name: 发布 GitHub Release
        run: gh release edit "$TAG" --repo "$PUBLIC_REPO" --draft=false --prerelease
      # 已装的软件从来财更新：传安装包、zip、dmg、MCP 文件和两个 yml（不传 blockmap），最后让来财换成新版本。
      # 来财只认 Kr1xxxx/WAswitch 的 OIDC 令牌，所以只在没拆仓库时运行
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SAME_REPO == 'true'
        with:
          node-version: 22
      - name: 传到来财（已装的软件从这里更新）
        if: env.SAME_REPO == 'true'
        run: node scripts/upload-cloud-release.mjs dist "$TAG"
      - name: 同步下载说明和 Clash 说明到公开仓库
        if: env.SAME_REPO != 'true'
        run: scripts/sync-public-repo.sh "$PUBLIC_REPO"
      - name: 不登录下载 latest.yml、安装包和 MCP 文件，确认能下
        if: env.SAME_REPO != 'true'
        run: scripts/verify-public-release.sh "$TAG" "$PUBLIC_REPO"
