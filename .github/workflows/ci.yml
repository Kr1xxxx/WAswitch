# 每次 push 和 PR 自动跑全部自检；再打一个 Windows 包启动 10 秒做冒烟，确认生成了自动更新需要的文件。
# 软件只发 Windows 和 macOS。自检放在 Ubuntu 上跑只是因为便宜、有 xvfb，不代表支持 Linux。
# 所有 action 按 commit 固定版本；只读权限。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: MCP 自检
        run: npm run check:mcp
      - name: 翻译自检
        run: npm run check:translate
      - name: 悬浮翻译自检
        run: node scripts/check-float.js && xvfb-run -a npx electron --no-sandbox scripts/check-float.js
      - name: 团队后台和团队模式自检
        run: npm run check:team
      - name: 并发、账号隔离和采集隐私回归
        run: npm run check:review
      - name: 轻量模式自检（Electron 内置 Node 和系统 Node 各一遍）
        run: npm run check:lite
      - name: 隔离自检
        run: xvfb-run -a npx electron --no-sandbox scripts/check-isolation.js
      - name: 读取对话列表自检
        run: xvfb-run -a npx electron --no-sandbox scripts/check-wa-page.js
      - name: 页面崩溃重建和保存设置同时发生
        run: xvfb-run -a node scripts/check-view-race.js
      - name: 内存回收不会反复刷新
        run: npm run check:memory
      - name: 自动更新自检
        run: npm run check:updater
      - name: 代理端口检测自检
        run: npm run check:ports
      - name: 安全写文件和新账号 id 自检
        run: npm run check:atomic
      - name: 编辑页保存自检
        run: npm run check:editor
      - name: 导入文件编码自检
        run: npm run check:import

  package-win:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 没有代码签名证书：不自动找签名证书
      - name: 打包（Windows 安装包）
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 生成了自动更新需要的文件
        shell: bash
        run: |
          grep -q '^sha512: ' dist/latest.yml
          ls dist/*.exe.blockmap
          grep -q 'provider: github' dist/win-unpacked/resources/app-update.yml
      - name: 打包后启动冒烟
        run: node scripts/smoke-packaged.js dist/win-unpacked/WAswitch.exe
