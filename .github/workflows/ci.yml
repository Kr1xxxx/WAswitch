# 每次 push 和 PR 自动跑全部自检，并打一个 Linux 包启动 10 秒做冒烟，确认生成了自动更新需要的文件。
# 所有 action 按 commit 固定版本；只读权限。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: MCP 自检
        run: npm run check:mcp
      - name: 翻译自检
        run: npm run check:translate
      - name: 悬浮翻译自检
        run: node scripts/check-float.js && xvfb-run -a npx electron --no-sandbox scripts/check-float.js
      - name: 团队后台和团队模式自检
        run: npm run check:team
      - name: 轻量模式自检（Electron 内置 Node 和系统 Node 各一遍）
        run: npm run check:lite
      - name: 隔离自检
        run: xvfb-run -a npx electron --no-sandbox scripts/check-isolation.js
      - name: 读取对话列表自检
        run: xvfb-run -a npx electron --no-sandbox scripts/check-wa-page.js
      - name: 页面崩溃重建和保存设置同时发生
        run: xvfb-run -a node scripts/check-view-race.js
      - name: 自动更新自检
        run: npm run check:updater
      - name: 打包（Linux 目录版和 AppImage）
        run: npx electron-builder --linux dir AppImage --publish never
      - name: 生成了自动更新需要的文件
        run: |
          grep -q '^sha512: ' dist/latest-linux.yml
          ls dist/*.AppImage.blockmap 2>/dev/null || grep -q 'blockMapSize' dist/latest-linux.yml
          grep -q 'provider: github' dist/linux-unpacked/resources/app-update.yml
      - name: 打包后启动冒烟
        run: xvfb-run -a node scripts/smoke-packaged.js dist/linux-unpacked/waswitch
