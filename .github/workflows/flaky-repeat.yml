# 临时：三个时好时坏的自检在 8 台机器上各重复跑 12 次，确认修好了。合并前删掉。
name: flaky-repeat

on:
  pull_request:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb fonts-dejavu-core fonts-dejavu-mono
      # 每一轮三项都跑，失败了不停，最后数一共坏了几次；坏的那次把输出打出来
      - name: 重复跑 12 轮
        shell: bash
        run: |
          bad=0
          for i in $(seq 1 12); do
            for name in mcp sel-focus tr-nochat; do
              case $name in
                mcp) cmd='npm run check:mcp' ;;
                sel-focus) cmd='xvfb-run -a npx electron --no-sandbox scripts/check-sel-focus.js' ;;
                tr-nochat) cmd='xvfb-run -a -s "-screen 0 1920x1200x24" node scripts/check-tr-nochat.js' ;;
              esac
              if bash -c "$cmd" > out.log 2>&1; then
                echo "第 $i 轮 $name 通过"
              else
                bad=$((bad + 1))
                echo "::error::第 $i 轮 $name 失败"
                grep -E '失败|Error|ECONN' out.log | head -20
              fi
            done
          done
          echo "一共失败 $bad 次"
          test "$bad" -eq 0
