# 临时试验：Windows 上按当前用户装字体后 local() 认不认。合并前删掉。
name: font-probe
on:
  push:
    branches: [claude/project-thread-ex4h1e]
    paths: ['scripts/font-probe/**', '.github/workflows/font-probe.yml', 'src/ui-fonts.js', 'remote/**']
permissions:
  contents: read
jobs:
  probe:
    if: false
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright-core@1.55.0
      - run: python -m pip install fonttools
      - name: 下载字体并校验
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\fonts"; New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest -Uri 'https://openfs.oppomobile.com/open/oop/202412/05/0f155015fff7700fbbcef7fa2aad78dc.zip' -OutFile "$d\oppo.zip"
          Expand-Archive "$d\oppo.zip" -DestinationPath "$d\oppo"
          Get-ChildItem -Recurse "$d\oppo" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          $o = Get-ChildItem -Recurse "$d\oppo" -Filter 'OPPO Sans 4.0.ttf' | Select-Object -First 1
          Copy-Item $o.FullName "$d\oppo.ttf"
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf' -OutFile "$d\noto.ttf"
          Get-FileHash "$d\oppo.ttf","$d\noto.ttf" -Algorithm SHA256 | Format-List
          (Get-Item "$d\oppo.ttf").Length; (Get-Item "$d\noto.ttf").Length
      - name: 字体名字
        run: python scripts/font-probe/names.py "$env:RUNNER_TEMP\names.json" oppo "$env:RUNNER_TEMP\fonts\oppo.ttf" noto "$env:RUNNER_TEMP\fonts\noto.ttf"
      - name: 试验
        run: node scripts/font-probe/run.mjs "$env:RUNNER_TEMP\fonts\oppo.ttf" "$env:RUNNER_TEMP\fonts\noto.ttf"
  e2e:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 真注册表跑安装代码
        run: npx electron scripts/font-probe/e2e.js; Get-Content "$env:RUNNER_TEMP\e2e.log"
