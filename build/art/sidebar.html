<!doctype html>
<meta charset="utf-8">
<!-- Windows 安装向导左侧图（欢迎页、完成页、卸载页）。164×314，生成后转成 24 位 BMP -->
<link rel="stylesheet" href="common.css">
<style>
  body { width: 164px; height: 314px; position: relative; color: #fff;
    background: radial-gradient(120% 70% at 0% 0%, #2BC27F 0%, rgba(43,194,127,0) 60%), linear-gradient(170deg, #1FAF6E 0%, #138A55 100%); }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.13); }
  .r1 { width: 260px; height: 260px; right: -150px; bottom: -110px; }
  .r2 { width: 180px; height: 180px; right: -110px; bottom: -70px; }
  .r3 { width: 100px; height: 100px; right: -70px; bottom: -30px; }
  .wrap { position: absolute; left: 20px; right: 16px; top: 34px; }
  .icon { width: 52px; height: 52px; box-shadow: 0 6px 16px rgba(0,0,0,.18), 0 0 0 2px rgba(255,255,255,.35); }
  h1 { margin-top: 18px; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  p { margin-top: 6px; font-size: 11.5px; line-height: 1.6; color: rgba(255,255,255,.88); }
  ul { position: absolute; left: 20px; bottom: 26px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 11px; color: rgba(255,255,255,.92); }
  li { display: flex; align-items: center; gap: 7px; }
  li i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; }
  li i::after { content: ''; width: 5px; height: 3px; border: solid #fff; border-width: 0 0 1.6px 1.6px; transform: translateY(-1px) rotate(-45deg); }
</style>
<body>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <div class="wrap">
    <img class="icon" src="../../assets/icon.png" alt="">
    <h1>WAswitch</h1>
    <p>一个窗口同时登录<br>多个 WhatsApp 账号</p>
  </div>
  <ul>
    <li><i></i>每个号互相隔离</li>
    <li><i></i>每个号单独走代理</li>
    <li><i></i>后台照常收消息</li>
  </ul>
</body>
