<!doctype html>
<meta charset="utf-8">
<!-- Mac 安装包（dmg）窗口背景。540×380（和 @2x 的 1080×760）。
     图标位置在 package.json 的 build.dmg.contents 里：WAswitch 在 (140, 170)，应用程序在 (400, 170) -->
<link rel="stylesheet" href="common.css">
<style>
  body { width: 540px; height: 380px; position: relative; color: #16181d;
    background: radial-gradient(90% 60% at 50% 0%, #F3EBDC 0%, rgba(243,235,220,0) 70%), #F5F6F8; }
  .title { position: absolute; top: 34px; left: 0; right: 0; text-align: center; }
  .title b { display: block; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.01em; }
  .title span { display: block; margin-top: 5px; font-size: var(--fs-m); color: #4a505a; }
  .slot { position: absolute; top: 108px; width: 132px; height: 156px; border-radius: 24px; background: rgba(255,255,255,.75); box-shadow: 0 1px 2px rgba(0,0,0,.05), inset 0 0 0 1px rgba(0,0,0,.05); }
  .s1 { left: 74px; } .s2 { left: 334px; }
  svg { position: absolute; left: 212px; top: 152px; }
  .foot { position: absolute; left: 30px; right: 30px; bottom: 22px; display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.7); font-size: var(--fs-s); line-height: 1.55; color: #4a505a; }
  .foot i { flex: none; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: #8A6A32; color: #fff; font: 700 var(--fs-s)/16px var(--font-ui); text-align: center; font-style: normal; }
  .foot b { color: #16181d; font-weight: 600; white-space: nowrap; }
</style>
<body>
  <div class="title"><b>安装 WAswitch</b><span>把左边的图标拖到右边的「应用程序」文件夹</span></div>
  <div class="slot s1"></div><div class="slot s2"></div>
  <svg width="116" height="36" viewBox="0 0 116 36" fill="none" stroke="#B48A45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 18h96" stroke-dasharray="2 9"/><path d="M94 8l12 10-12 10"/>
  </svg>
  <div class="foot"><i>i</i><span>第一次打开如果提示「无法验证开发者」：先双击一次，再打开 <b>系统设置 › 隐私与安全性</b>，在页面下方点「仍要打开」。</span></div>
</body>
